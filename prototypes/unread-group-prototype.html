<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi Web · 未读分组交互原型</title>
  <!--
    原型假设：沿用现有未读规则，仅改变侧边栏展示，不改变服务器数据或跨设备语义。
    推荐 A：未读优先，未读完成后回到原来的置顶或项目；B：置顶优先；C：未读仅是快捷入口。
    数据均为示例；变化只保存在本页内存中，刷新还原，不连接实际会话。
    设计来源：项目 sidebar.css 的 28px 行高、两条对齐线、原生深浅主题色及置顶分组结构。
  -->
  <style>
    :root { color-scheme: dark; --bg:#1a1a1a; --panel:#242424; --hover:#2e2e2e; --selected:#383838; --border:#454545; --text:#e8e8e8; --muted:#b7b7b7; --dim:#a4a4a4; --accent:#a4c2f4; --user:#292929; --unread:#0891b2; --paper:#141414; }
    html[data-theme="light"] { color-scheme:light; --bg:#fff; --panel:#f5f5f5; --hover:#eee; --selected:#e8e8e8; --border:#e0e0e0; --text:#1a1a1a; --muted:#515c6b; --dim:#5e6673; --accent:#245bce; --user:#eff6ff; --paper:#ececec; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:var(--paper); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button { color:inherit; font:inherit; cursor:pointer; }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .frame { width:min(1260px,calc(100% - 64px)); margin:0 auto; }
    .intro { display:flex; align-items:end; justify-content:space-between; gap:24px; padding:37px 0 23px; }
    .eyebrow { color:var(--dim); font-size:11px; letter-spacing:.08em; font-weight:650; text-transform:uppercase; }
    h1 { margin:7px 0 5px; font-size:26px; line-height:1.25; letter-spacing:-.03em; font-weight:650; }
    .intro p { margin:0; color:var(--muted); font-size:13px; }
    .theme { flex:none; border:1px solid var(--border); background:transparent; border-radius:6px; padding:7px 11px; font-size:12px; }
    .theme:hover, .reset:hover { background:var(--hover); }
    .chooser { display:flex; flex-wrap:wrap; align-items:stretch; gap:7px; margin-bottom:15px; }
    .variant { text-align:left; border:1px solid var(--border); background:var(--panel); border-radius:7px; padding:9px 13px; color:var(--muted); font-size:12px; }
    .variant strong { font-weight:600; color:var(--text); }
    .variant[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
    .variant .tag { margin-left:6px; color:var(--accent); font-size:11px; }
    .mock { display:grid; grid-template-columns:270px minmax(0,1fr); min-height:650px; border:1px solid var(--border); border-radius:8px; background:var(--bg); overflow:hidden; box-shadow:0 16px 50px rgba(0,0,0,.13); }
    .sidebar { min-width:0; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; }
    .topbar, .chatbar { height:36px; display:flex; align-items:center; border-bottom:1px solid var(--border); flex:none; }
    .topbar { padding-left:11px; }
    .brand { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:700; font-size:15px; }
    .mobile-tabs { display:none; }
    .tools { margin-left:auto; display:flex; height:100%; }
    .tool { width:36px; border:0; border-left:1px solid var(--border); background:transparent; color:var(--muted); font-size:19px; }
    .tree { padding:8px 6px 16px; flex:1; overflow:auto; }
    .section + .section { margin-top:8px; }
    .head { width:100%; height:28px; display:flex; align-items:center; gap:3px; padding:0 5px; border:0; background:transparent; text-align:left; color:var(--muted); }
    .head:hover { color:var(--text); }
    .head .label { font-size:11px; font-weight:600; letter-spacing:.05em; }
    .head.project .label { font-size:12px; letter-spacing:0; }
    .head .count { font-size:11px; color:var(--dim); }
    .chev { width:12px; height:12px; display:inline-grid; place-items:center; flex:none; color:var(--dim); font-size:15px; line-height:1; transition:transform .12s; }
    .chev.open { transform:rotate(90deg); }
    .row { position:relative; height:28px; display:flex; align-items:center; padding:0 4px 0 20px; border-radius:7px; min-width:0; }
    .row:hover, .row.menu-open { background:var(--hover); }
    .row.selected { background:var(--selected); }
    .row.selected::before { content:""; position:absolute; left:0; top:7px; bottom:7px; width:3px; border-radius:0 2px 2px 0; background:var(--accent); }
    .row-main { border:0; background:transparent; display:flex; align-items:center; gap:7px; padding:0; min-width:0; height:100%; width:100%; text-align:left; font-size:12px; }
    .title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:20px; }
    .row.selected .title { font-weight:600; }
    .meta { color:var(--dim); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:67px; flex:none; }
    .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--unread); flex:none; }
    .row-menu-button { display:none; flex:none; width:24px; height:24px; padding:0; border:0; border-radius:5px; background:transparent; color:var(--muted); }
    .row:hover .row-menu-button, .row:focus-within .row-menu-button, .row.menu-open .row-menu-button { display:block; }
    .row-menu-button:hover { background:var(--selected); color:var(--text); }
    .row:has(.row-menu-button:hover) .meta { display:none; }
    .menu { position:absolute; z-index:5; top:24px; right:1px; min-width:132px; padding:4px; border:1px solid var(--border); border-radius:7px; background:var(--panel); box-shadow:0 10px 25px rgba(0,0,0,.25); }
    .menu button { width:100%; display:block; padding:6px 9px; border:0; border-radius:4px; background:transparent; text-align:left; font-size:12px; }
    .menu button:hover { background:var(--hover); }
    .footer-item { color:var(--dim); font-size:12px; padding:13px 0 0 20px; }
    .files { border-top:1px solid var(--border); padding:6px 11px 10px; min-height:140px; }
    .files-label { font-size:11px; letter-spacing:.05em; color:var(--muted); font-weight:600; }
    .file-path { font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--dim); margin:12px 0 0 15px; }
    .workspace { min-width:0; display:flex; flex-direction:column; }
    .chatbar { padding:0 16px; color:var(--muted); font-size:12px; }
    .chatbar .right { margin-left:auto; color:var(--dim); }
    .chat { max-width:720px; width:100%; margin:0 auto; padding:45px 48px 30px; flex:1; }
    .mock-label { color:var(--dim); font-size:11px; letter-spacing:.06em; }
    .message { width:fit-content; max-width:100%; margin:15px 0 24px auto; padding:12px 15px; border:1px solid var(--border); border-radius:10px; background:var(--user); line-height:1.65; font-size:13px; }
    .reply { max-width:570px; color:var(--text); font-size:13px; line-height:1.85; }
    .reply p { margin:0 0 14px; }
    .reply strong { font-weight:650; }
    .reply ul { padding-left:19px; color:var(--muted); }
    .context { display:inline-flex; gap:8px; align-items:center; margin-top:8px; color:var(--dim); font-size:11px; }
    .composer { margin:0 32px 27px; border:1px solid var(--border); border-radius:10px; padding:12px 15px; color:var(--dim); font-size:12px; }
    .composer small { display:block; margin-top:16px; }
    .below { display:grid; grid-template-columns:1fr auto; gap:20px; align-items:start; padding:16px 1px 32px; }
    .explain { color:var(--muted); font-size:12px; line-height:1.8; }
    .explain strong { color:var(--text); font-weight:600; }
    .explain p { margin:0 0 3px; }
    .reset { border:1px solid var(--border); border-radius:6px; padding:7px 10px; background:transparent; font-size:12px; white-space:nowrap; }
    .notice { color:var(--dim); font-size:11px; }
    @media (max-width:720px) {
      .frame { width:calc(100% - 28px); }
      .intro { padding:24px 0 17px; align-items:start; }
      h1 { font-size:21px; }
      .intro p { max-width:310px; }
      .variant { flex:1 1 46%; }
      .mock { grid-template-columns:minmax(0,1fr); min-height:0; }
      .sidebar { min-height:460px; border:0; }
      .topbar .brand { display:none; }
      .mobile-tabs { display:flex; align-items:center; height:100%; gap:16px; color:var(--muted); font-size:12px; }
      .mobile-tabs strong { height:100%; display:flex; align-items:center; border-top:2px solid var(--accent); color:var(--text); font-weight:600; }
      .tree { min-height:400px; }
      .head, .row { height:44px; }
      .row.selected::before { top:12px; bottom:12px; }
      .files { display:none; }
      .workspace { min-height:310px; border-top:1px solid var(--border); }
      .chat { padding:24px 20px; }
      .message { margin-top:10px; }
      .composer { margin:0 16px 16px; }
      .below { grid-template-columns:1fr; }
      .reset { justify-self:start; }
    }
    @media (hover:none) { .row-menu-button { display:block; } }
  </style>
</head>
<body>
  <main class="frame">
    <header class="intro">
      <div><div class="eyebrow">Pi Web / interaction study</div><h1>把未读会话收在一起</h1><p>沿用置顶分组的视觉语言；对比三个会话归属方案。</p></div>
      <button class="theme" id="theme" type="button">切换浅色</button>
    </header>
    <nav class="chooser" aria-label="未读分组方案">
      <button class="variant" type="button" data-mode="unread-first" aria-pressed="true"><strong>A · 未读优先</strong><span class="tag">推荐</span><br>未读时移入，读后归位</button>
      <button class="variant" type="button" data-mode="pinned-first" aria-pressed="false"><strong>B · 置顶优先</strong><br>置顶不动，只收其他未读</button>
      <button class="variant" type="button" data-mode="shortcut" aria-pressed="false"><strong>C · 快捷入口</strong><br>汇总未读，原位置也保留</button>
    </nav>
    <div class="mock">
      <aside class="sidebar" aria-label="示例会话侧边栏">
        <div class="topbar"><span class="brand">Pi Web</span><div class="mobile-tabs"><strong>会话</strong><span>文件</span></div><div class="tools"><button class="tool" title="新会话（示意）" aria-label="新会话（示意）" disabled>＋</button><button class="tool" title="搜索（示意）" aria-label="搜索（示意）" disabled>⌕</button></div></div>
        <div class="tree" id="tree"></div>
        <div class="files"><span class="chev open" aria-hidden="true">›</span><span class="files-label">文件</span><div class="file-path">~/workspace/pi-web<br>　src　　docs　　README.md</div></div>
      </aside>
      <section class="workspace" aria-label="示例会话内容">
        <div class="chatbar"><span id="chat-title">新增侧边栏分组</span><span class="right">示例会话</span></div>
        <div class="chat">
          <div class="mock-label">示例数据 · 不是你的实际会话</div>
          <div class="message" id="message">为会话侧边栏增加一个未读分组。</div>
          <div class="reply" id="reply"></div>
          <div class="context" id="context"></div>
        </div>
        <div class="composer">继续对话…<small>此区域仅示意；请操作左侧的示例会话。</small></div>
      </section>
    </div>
    <div class="below">
      <div class="explain"><p id="mode-description"></p><p class="notice">试一试：点击未读会话、折叠分组，或用行尾「⋯」标记已读 / 未读及置顶。所有内容均为示例。</p></div>
      <button class="reset" id="reset" type="button">重置示例数据</button>
    </div>
  </main>
  <script>
    const initialSessions = [
      { id:'sync', title:'修复会话状态同步', project:'pi-web', pinned:true, unread:true, age:'2 分钟', prompt:'确认会话状态同步的处理方案。', answer:'后台任务已完成。点击左侧未读会话后，这条示例会话会自动标为已读。' },
      { id:'release', title:'梳理发布流程', project:'product-notes', pinned:false, unread:true, age:'5 分钟', prompt:'请整理本周的发布步骤。', answer:'发布步骤已整理。未读状态只影响分组展示，不会删除会话。' },
      { id:'design', title:'会话管理优化', project:'pi-web', pinned:true, unread:false, age:'昨天', prompt:'梳理会话管理的交互。', answer:'已整理会话管理的交互重点。' },
      { id:'sidebar', title:'新增侧边栏分组', project:'pi-web', pinned:false, unread:false, age:'今天', prompt:'为会话侧边栏增加一个未读分组。', answer:'已保留现有置顶、项目与文件区域。请选择一种未读分组方式，并点击示例会话体验。' },
      { id:'notes', title:'整理设计记录', project:'product-notes', pinned:false, unread:false, age:'昨天', prompt:'整理设计讨论的记录。', answer:'设计讨论记录已整理。' },
    ];
    let sessions = structuredClone(initialSessions);
    let selected = 'sidebar';
    let mode = 'unread-first';
    let folds = { unread:false, pinned:false, 'pi-web':false, 'product-notes':false };
    let menuId = null;
    const descriptions = {
      'unread-first':'<strong>A · 推荐：</strong>所有未读会话先进入未读组，包括已置顶会话；已读后回到原来的置顶或项目，不出现重复行。',
      'pinned-first':'<strong>B · 置顶优先：</strong>已置顶会话始终留在置顶组；未读组只收未置顶的会话，置顶会话继续用圆点提示。',
      'shortcut':'<strong>C · 快捷入口：</strong>未读组展示所有未读会话的快捷入口；原置顶或项目位置仍保留，因此会出现重复行。',
    };
    const tree = document.querySelector('#tree');
    const esc = value => String(value).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function sessionRow(s, where) {
      const projectMeta = where === 'unread' || where === 'pinned';
      const dot = s.unread ? '<span class="dot" aria-label="未读"></span>' : '';
      const meta = projectMeta ? `<span class="meta">${esc(s.project)}</span>${dot}` : (s.unread ? dot : `<span class="meta">${esc(s.age)}</span>`);
      const rowKey = `${where}:${s.id}`;
      const menu = menuId === rowKey ? `<div class="menu"><button type="button" data-action="read" data-id="${s.id}">${s.unread ? '标为已读' : '标为未读'}</button><button type="button" data-action="pin" data-id="${s.id}">${s.pinned ? '取消置顶' : '置顶'}</button></div>` : '';
      return `<div class="row${selected === s.id ? ' selected' : ''}${menuId === rowKey ? ' menu-open' : ''}"><button class="row-main" type="button" data-action="open" data-id="${s.id}" aria-label="打开${esc(s.title)}${s.unread ? '，未读' : ''}"><span class="title">${esc(s.title)}</span>${meta}</button><button class="row-menu-button" type="button" data-action="menu" data-id="${s.id}" data-place="${where}" aria-label="${esc(s.title)}的操作菜单" aria-expanded="${menuId === rowKey}">⋯</button>${menu}</div>`;
    }
    function section(key, label, list, project = false) {
      if (!project && list.length === 0) return '';
      const collapsed = folds[key];
      const count = project ? '' : `<span class="count">· ${list.length}</span>`;
      return `<section class="section"><button class="head${project ? ' project' : ''}" type="button" data-action="fold" data-key="${key}" aria-expanded="${!collapsed}"><span class="chev${collapsed ? '' : ' open'}" aria-hidden="true">›</span><span class="label">${esc(label)}</span>${count}</button>${collapsed ? '' : list.map(s => sessionRow(s, project ? 'group' : key)).join('')}</section>`;
    }
    function render() {
      const allUnread = sessions.filter(s => s.unread);
      const unread = mode === 'pinned-first' ? allUnread.filter(s => !s.pinned) : allUnread;
      const pinned = sessions.filter(s => s.pinned && (mode !== 'unread-first' || !s.unread));
      const inProject = s => !s.pinned && (mode === 'shortcut' || !s.unread);
      tree.innerHTML = section('unread','未读',unread) + section('pinned','置顶',pinned)
        + section('pi-web','pi-web',sessions.filter(s => s.project === 'pi-web' && inProject(s)),true)
        + section('product-notes','product-notes',sessions.filter(s => s.project === 'product-notes' && inProject(s)),true)
        + '<div class="footer-item">＋　打开其他项目…</div>';
      const current = sessions.find(s => s.id === selected);
      document.querySelector('#chat-title').textContent = current.title;
      document.querySelector('#message').textContent = current.prompt;
      document.querySelector('#reply').innerHTML = `<p>${esc(current.answer)}</p><p>左侧展示的是<strong>示例状态</strong>，不会连接或修改实际会话。</p>`;
      document.querySelector('#context').textContent = `${current.project}  ·  ${current.pinned ? '已置顶' : '未置顶'}  ·  ${current.unread ? '未读' : '已读'}`;
      document.querySelector('#mode-description').innerHTML = descriptions[mode];
      document.querySelectorAll('.variant').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    }
    tree.addEventListener('click', event => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const { action, id, key, place } = button.dataset;
      if (action === 'fold') { folds[key] = !folds[key]; menuId = null; }
      if (action === 'menu') {
        const rowKey = `${place}:${id}`;
        menuId = menuId === rowKey ? null : rowKey;
      }
      const s = sessions.find(item => item.id === id);
      if (s && action === 'open') { selected = id; s.unread = false; menuId = null; }
      if (s && action === 'read') { s.unread = !s.unread; menuId = null; }
      if (s && action === 'pin') { s.pinned = !s.pinned; menuId = null; }
      render();
      // A keyboard activation replaces the old row; keep focus in the tree.
      if (event.detail === 0) {
        const target = action === 'fold' ? tree.querySelector(`[data-action="fold"][data-key="${key}"]`)
          : action === 'menu' ? (tree.querySelector('.menu button') || tree.querySelector(`[data-action="menu"][data-id="${id}"][data-place="${place}"]`))
          : s ? (tree.querySelector(`[data-action="open"][data-id="${id}"]`) || tree.querySelector(`[data-action="fold"][data-key="${s.pinned ? 'pinned' : s.project}"]`))
          : null;
        target?.focus({ preventScroll:true });
      }
    });
    tree.addEventListener('keydown', event => {
      if (event.key !== 'Escape' || menuId === null) return;
      event.preventDefault();
      const [place, id] = menuId.split(':');
      menuId = null;
      render();
      tree.querySelector(`[data-action="menu"][data-id="${id}"][data-place="${place}"]`)?.focus({ preventScroll:true });
    });
    document.querySelector('.chooser').addEventListener('click', event => {
      const button = event.target.closest('[data-mode]');
      if (!button) return;
      mode = button.dataset.mode;
      menuId = null;
      render();
    });
    document.querySelector('#theme').addEventListener('click', event => {
      const light = document.documentElement.dataset.theme !== 'light';
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
      event.currentTarget.textContent = light ? '切换深色' : '切换浅色';
    });
    document.querySelector('#reset').addEventListener('click', () => {
      sessions = structuredClone(initialSessions); selected = 'sidebar';
      folds = { unread:false, pinned:false, 'pi-web':false, 'product-notes':false }; menuId = null; render();
    });
    render();
  </script>
</body>
</html>
